<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Hair Color Mixer</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: Arial; text-align:center; background:#fafafa; color:#333; padding:10px; }
    video,canvas { width:100%; border-radius:15px; display:none; }
    #countdown { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:6rem; color:white; text-shadow:0 0 10px black; display:none; }
    button { width:100%; padding:15px; border:none; border-radius:50px; font-size:1.2rem; background:#ff4569; color:white; box-shadow:0 3px 10px rgba(0,0,0,0.2); margin-top:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; margin-top:15px; }
    .card { background:white; border-radius:12px; padding:8px; box-shadow:0 3px 10px rgba(0,0,0,0.15); cursor:pointer; }
    .card:hover, .selected { transform:scale(1.05); border:3px solid #ff4569; }
  </style>
</head>
<body>
<h1>Hair Color Mixer</h1>
<div style="position:relative;">
  <video id="video" autoplay playsinline></video>
  <canvas id="preview"></canvas>
  <div id="countdown">3</div>
</div>
<p id="status">Load and allow camera access</p>
<button id="start-btn">Start Camera</button>
<button id="retry-btn" style="display:none;">Try Again</button>
<div id="results" style="display:none;">
  <h3>Your Face with Different Hair Colors</h3>
  <div class="grid" id="color-grid"></div>
  <button id="mix-btn" style="display:none;">Mix Selected Color</button>
  <p id="log"></p>
</div>

<script>
const video = document.getElementById('video');
const previewCanvas = document.getElementById('preview');
const ctx = previewCanvas.getContext('2d');
const countdownEl = document.getElementById('countdown');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const retryBtn = document.getElementById('retry-btn');
const results = document.getElementById('results');
const grid = document.getElementById('color-grid');
const mixBtn = document.getElementById('mix-btn');
const log = document.getElementById('log');
let faceLandmarks = null;
let capturedDataURL = null;
let stream = null;
let camera = null;
let selectedCard = null;

const hairColors = [
  { name:"Golden Blonde", hex:"#f5e050" },
  { name:"Ash Blonde", hex:"#e0d8c3" },
  { name:"Light Brown", hex:"#c68642" },
  { name:"Chocolate Brown", hex:"#5d4037" },
  { name:"Jet Black", hex:"#1c1c1c" },
  { name:"Auburn Red", hex:"#a52a2a" },
  { name:"Rose Pink", hex:"#f48fb1" },
  { name:"Pastel Blue", hex:"#81d4fa" },
  { name:"Platinum Silver", hex:"#d0d0d0" },
  { name:"Violet Purple", hex:"#9c27b0" }
];

// FaceMesh setup
const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
faceMesh.onResults(r => {
  faceLandmarks = r.multiFaceLandmarks?.[0] || null;
});

// Start camera
async function startCamera() {
  results.style.display = 'none';
  retryBtn.style.display = 'none';
  statusEl.textContent = 'Accessing camera...';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = stream;
    video.style.display = 'block';
    statusEl.textContent = 'Camera activated';

    camera = new Camera(video, {
      onFrame: async () => { await faceMesh.send({image: video}); },
      width: 480,
      height: 480
    });
    camera.start();

    setTimeout(countdownCapture, 1000);
  } catch (err) {
    statusEl.textContent = 'Camera error: ' + err.message;
    retryBtn.style.display = 'block';
  }
}

// Countdown then capture
function countdownCapture() {
  let count = 3;
  countdownEl.textContent = count;
  countdownEl.style.display = 'block';
  const timer = setInterval(() => {
    count--;
    countdownEl.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      countdownEl.style.display = 'none';
      capturePhoto();
    }
  }, 1000);
}

// Capture photo
function capturePhoto() {
  if (!faceLandmarks) {
    statusEl.textContent = '❌ No face detected! Please reposition & try again.';
    retryBtn.style.display = 'block';
    return;
  }
  previewCanvas.width = video.videoWidth;
  previewCanvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, previewCanvas.width, previewCanvas.height);
  capturedDataURL = previewCanvas.toDataURL('image/png');

  if (stream) stream.getTracks().forEach(t => t.stop());
  video.style.display = 'none';
  previewCanvas.style.display = 'block';
  statusEl.textContent = '✅ Face captured successfully!';
  showColorOptions();
}

// Improved tintHair – better area + natural blend
function tintHair(colorHex) {
  return new Promise(resolve => {
    const img = new Image();
    img.src = capturedDataURL;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const c = canvas.getContext('2d');
      c.drawImage(img, 0, 0);

      if (faceLandmarks) {
        // Wider hair/scalp area using Face Mesh landmarks
        const indices = [
          10, 151, 9, 8, 168, 6, 197, 195, 5, 4, 1, 2, 164, 0, 11,  // center top
          447, 332, 297, 338, 10, 109, 10, 338, 265, 372, 345, 340, 265  // sides + back
        ];
        const pts = indices.map(i => ({
          x: faceLandmarks[i].x * canvas.width,
          y: faceLandmarks[i].y * canvas.height
        }));

        c.save();
        c.beginPath();
        c.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          c.lineTo(pts[i].x, pts[i].y);
        }
        c.closePath();
        c.clip();

        // Natural hair tint
        c.globalCompositeOperation = 'multiply';
        c.globalAlpha = 0.45;
        c.fillStyle = colorHex;
        c.fillRect(0, 0, canvas.width, canvas.height);
        c.restore();
      }
      resolve(canvas);
    };
  });
}

// Show color previews
async function showColorOptions() {
  results.style.display = 'block';
  grid.innerHTML = '';
  for (const color of hairColors) {
    const card = document.createElement('div');
    card.className = 'card';
    const tintCanvas = await tintHair(color.hex);
    const displayCanvas = document.createElement('canvas');
    displayCanvas.width = 150;
    displayCanvas.height = 150 * tintCanvas.height / tintCanvas.width;
    displayCanvas.getContext('2d').drawImage(tintCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
    card.appendChild(displayCanvas);

    const label = document.createElement('div');
    label.innerHTML = `<div style="width:15px;height:15px;border-radius:50%;display:inline-block;background:${color.hex};margin-right:6px;"></div>${color.name}`;
    card.appendChild(label);

    card.onclick = () => {
      if (selectedCard) selectedCard.classList.remove('selected');
      card.classList.add('selected');
      selectedCard = card;
      log.innerHTML = `Selected color: <b>${color.name}</b> (${color.hex})`;
      mixBtn.style.display = 'block';
    };
    grid.appendChild(card);
  }
}

// Buttons
startBtn.onclick = startCamera;
retryBtn.onclick = startCamera;
mixBtn.onclick = () => {
  log.innerHTML += ' <br>🎨 Mixing 50ml color ready for application!';
};
</script>
</body>
</html>
